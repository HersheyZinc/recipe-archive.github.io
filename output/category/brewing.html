<!DOCTYPE html>
<html>
    <head>
        <title> Articles in brewing category - Recipe Lab</title>
        <meta charset="utf-8" />
        <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://hersheyzinc.github.io/recipe-archive.github.io/theme/css/custom.css" rel="stylesheet" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    </head>

    <body id="index" class="archive">
        <div class="container">
            <div class="header">
                <h3 class="text-muted"><a href="https://hersheyzinc.github.io/recipe-archive.github.io/index.html">Recipe Lab</a></h3>
                <h2 class="text-muted"></h2>
            </div>

<h1>Search Recipes</h1>

<input type="text" id="searchBox" placeholder="Search recipes..." />

<select id="categoryFilter">
    <option value="">All Categories</option>
        <option value="baking">baking</option>
        <option value="brewing">brewing</option>
        <option value="creami">creami</option>
</select>

<div class="recipe-grid">

<a class="recipe-card"
   href="https://hersheyzinc.github.io/recipe-archive.github.io/plain-kombucha.html"
   data-title="plain kombucha"
   data-category="brewing">


    <img class="recipe-thumb" src="https://hersheyzinc.github.io/recipe-archive.github.io/recipes/kombucha/thumbnail.jpg" alt="Plain Kombucha">

    <div class="recipe-info">
        <h3>Plain Kombucha</h3>
        <span class="tag tag-brewing">
            brewing
        </span>
        <p><p>Plain black tea kombucha that can be flavoured afterwards</p></p>
    </div>

</a>
<a class="recipe-card"
   href="https://hersheyzinc.github.io/recipe-archive.github.io/sugar-wash.html"
   data-title="sugar wash"
   data-category="brewing">


    <img class="recipe-thumb" src="https://hersheyzinc.github.io/recipe-archive.github.io/recipes/sugar-wash/thumbnail.jpg" alt="Sugar Wash">

    <div class="recipe-info">
        <h3>Sugar Wash</h3>
        <span class="tag tag-brewing">
            brewing
        </span>
        <p><p>Unflavoured alcohol fermented from sugar. Can be flavoured or infused with other ingredients after fermentation.</p></p>
    </div>

</a>
<a class="recipe-card"
   href="https://hersheyzinc.github.io/recipe-archive.github.io/mead.html"
   data-title="mead"
   data-category="brewing">


    <img class="recipe-thumb" src="https://hersheyzinc.github.io/recipe-archive.github.io/recipes/plain-mead/thumbnail.jpg" alt="Mead">

    <div class="recipe-info">
        <h3>Mead</h3>
        <span class="tag tag-brewing">
            brewing
        </span>
        <p><p>Plain mead</p></p>
    </div>

</a>

</div>

<script>
    const searchBox = document.getElementById("searchBox");
    const categoryFilter = document.getElementById("categoryFilter");
    const cards = document.querySelectorAll(".recipe-card");

    function filterRecipes() {
        const query = searchBox.value.toLowerCase();
        const selected = categoryFilter.value;

        cards.forEach(card => {
            const title = card.dataset.title;
            const category = card.dataset.category;

            const matchesSearch =
                title.includes(query) || category.includes(query);

            const matchesCategory =
                selected === "" || category === selected;

            card.style.display =
                matchesSearch && matchesCategory
                ? "block"
                : "none";
        });
    }

    searchBox.addEventListener("input", filterRecipes);
    categoryFilter.addEventListener("change", filterRecipes);
</script>

            <footer id="contentinfo" class="footer">

            </footer><!-- /#contentinfo -->
        </div><!-- container -->
    </body>
</html>
