<!DOCTYPE html>
<html>
    <head>
        <title> Articles in creami category - Recipe Lab</title>
        <meta charset="utf-8" />
        <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" />
        <link href="/theme/css/custom.css" rel="stylesheet" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    </head>

    <body id="index" class="archive">
        <div class="container">
            <div class="header">
                <h3 class="text-muted"><a href="/index.html">Recipe Lab</a></h3>
                <h2 class="text-muted"></h2>
            </div>

<h1>Search Recipes</h1>

<input type="text" id="searchBox" placeholder="Search recipes..." />

<select id="categoryFilter">
    <option value="">All Categories</option>
        <option value="baking">baking</option>
        <option value="brewing">brewing</option>
        <option value="creami">creami</option>
</select>

<div class="recipe-grid">

<a class="recipe-card"
   href="/lemon-sorbet.html"
   data-title="lemon sorbet"
   data-category="creami">


    <img class="recipe-thumb" src="/recipes/lemon-sorbet/thumbnail.jpg" alt="Lemon Sorbet">

    <div class="recipe-info">
        <h3>Lemon Sorbet</h3>
        <span class="tag tag-creami">
            creami
        </span>
        <p><p>Milky lemon sorbet that tastes like yakult</p></p>
    </div>

</a>

</div>

<script>
    const searchBox = document.getElementById("searchBox");
    const categoryFilter = document.getElementById("categoryFilter");
    const cards = document.querySelectorAll(".recipe-card");

    function filterRecipes() {
        const query = searchBox.value.toLowerCase();
        const selected = categoryFilter.value;

        cards.forEach(card => {
            const title = card.dataset.title;
            const category = card.dataset.category;

            const matchesSearch =
                title.includes(query) || category.includes(query);

            const matchesCategory =
                selected === "" || category === selected;

            card.style.display =
                matchesSearch && matchesCategory
                ? "block"
                : "none";
        });
    }

    searchBox.addEventListener("input", filterRecipes);
    categoryFilter.addEventListener("change", filterRecipes);
</script>

            <footer id="contentinfo" class="footer">

            </footer><!-- /#contentinfo -->
        </div><!-- container -->
    </body>
</html>
