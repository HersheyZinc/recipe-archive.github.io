<!DOCTYPE html>
<html>
    <head>
        <title> Articles in creami category - Recipe Lab</title>
        <meta charset="utf-8" />
        <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://hersheyzinc.github.io/recipe-archive.github.io/theme/css/custom.css" rel="stylesheet" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    </head>

    <body id="index" class="archive">
        <div class="container">
            <div class="header">
                <h3 class="text-muted"><a href="https://hersheyzinc.github.io/recipe-archive.github.io/index.html">Recipe Lab</a></h3>
                <h2 class="text-muted"></h2>
            </div>

<h1>Search Recipes</h1>

<input type="text" id="searchBox" placeholder="Search recipes..." />

<div class="recipe-grid">

<a class="recipe-card"
   href="https://hersheyzinc.github.io/recipe-archive.github.io/lemon-sorbet.html"
   data-title="lemon sorbet"
   data-category="creami">

    <img class="recipe-thumb" src="https://hersheyzinc.github.io/recipe-archive.github.io/images/test.jpg">

    <div class="recipe-info">
        <h3>Lemon Sorbet</h3>
        <span class="tag">creami</span>
        <p><p>Milky lemon sorbet that tastes like yakult</p></p>
    </div>

</a>

</div>

<script>
const searchBox = document.getElementById("searchBox");
const cards = document.querySelectorAll(".recipe-card");

searchBox.addEventListener("input", function () {
    const query = this.value.toLowerCase();

    cards.forEach(card => {
        const title = card.dataset.title;
        const category = card.dataset.category;

        card.style.display =
            (title.includes(query) || category.includes(query))
            ? "block"
            : "none";
    });
});
</script>

</html>
