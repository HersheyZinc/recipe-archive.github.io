{% extends "base.html" %}

{% block content %}
<h1>Recipes</h1>

<div class="recipe-grid">
{% for article in articles %}
<a class="recipe-card" href="{{ article.url }}">
<img class="recipe-thumb" src="/{{ article.metadata.thumbnail }}">
<div class="recipe-info">
<h3>{{ article.title }}</h3>
<span class="tag">{{ article.category }}</span>
<p>{{ article.summary }}</p>
</div>
</a>
{% endfor %}
</div>
{% endblock %}
