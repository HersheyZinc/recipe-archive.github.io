{% extends "base.html" %}

{% block content %}

<h1>Search Recipes</h1>

<input type="text" id="searchBox" placeholder="Search recipes..." />

<div class="recipe-grid">

{% for article in articles %}
<a class="recipe-card"
   href="{{ article.url }}"
   data-title="{{ article.title | lower }}"
   data-category="{{ article.category | lower }}">

    <img class="recipe-thumb" src="/{{ article.metadata.thumbnail }}">

    <div class="recipe-info">
        <h3>{{ article.title }}</h3>
        <span class="tag">{{ article.category }}</span>
        <p>{{ article.summary }}</p>
    </div>

</a>
{% endfor %}

</div>

<script>
const searchBox = document.getElementById("searchBox");
const cards = document.querySelectorAll(".recipe-card");

searchBox.addEventListener("input", function () {
    const query = this.value.toLowerCase();

    cards.forEach(card => {
        const title = card.dataset.title;
        const category = card.dataset.category;

        card.style.display =
            (title.includes(query) || category.includes(query))
            ? "block"
            : "none";
    });
});
</script>

{% endblock %}
