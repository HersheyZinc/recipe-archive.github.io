<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>Recipe Lab - </title>

<link rel="stylesheet" href="/theme/css/style.css">

</head>

<body>

<header>

<h1><a href="/">Recipe Lab</a></h1>

<nav>

<a href="/">Recipes</a>
<a href="/pages/search.html">Search</a>

</nav>

</header>

<main>


<h1>Lemon Sorbet</h1>
<p class="tag">creami</p>
<p><p>Milky lemon sorbet that tastes like yakult</p></p>
<img src="/images/lemon_sorbet_thumb.jpg">


<h2>Yield</h2>
<input id="scale" type="number" value="1" step="0.5" style="width:60px;">
<span id="yield-display"> (s)</span>

<h2>Ingredients</h2>
<ul id="ingredients" style="list-style: none">
<li>
    <label>
      <input type="checkbox" class="ingredient-checkbox" data-base="0.5">
      <span class="amount">0.5</span> cups sugar
    </label>
</li>
<li>
    <label>
      <input type="checkbox" class="ingredient-checkbox" data-base="1">
      <span class="amount">1</span> tbsp corn syrup
    </label>
</li>
<li>
    <label>
      <input type="checkbox" class="ingredient-checkbox" data-base="90">
      <span class="amount">90</span> g greek style yoghurt
    </label>
</li>
<li>
    <label>
      <input type="checkbox" class="ingredient-checkbox" data-base="0.5">
      <span class="amount">0.5</span> cups lemon juice
 (~2 lemons)    </label>
</li>
<li>
    <label>
      <input type="checkbox" class="ingredient-checkbox" data-base="1">
      <span class="amount">1</span> cups milk
    </label>
</li>
</ul>

<h2>Instructions</h2>
<ol>
<li>
<p>In a large bowl, whisk together all the ingredients until fully combined.</p>
</li>
<li>
<p>Pour base into creami pint and freeze for 24 hours.</p>
</li>
<li>
<p>Spin on <strong>Sorbet</strong> mode.</p>
</li>
</ol>

<script>
const scaleInput = document.getElementById("scale");
const ingredientItems = document.querySelectorAll("#ingredients li input.ingredient-checkbox");

// Store original amounts for scaling
ingredientItems.forEach(input => {
    input.dataset.baseAmount = parseFloat(input.dataset.base);
});

// Original yield from metadata
const originalYield = parseFloat(scaleInput.value);

function updateIngredients() {
    const desiredYield = parseFloat(scaleInput.value) || originalYield;

    ingredientItems.forEach(input => {
        const li = input.closest("li");
        const amountSpan = li.querySelector(".amount");
        const base = parseFloat(input.dataset.baseAmount);

        // Scale ingredient proportional to yield
        amountSpan.textContent = ((base / originalYield) * desiredYield).toFixed(2);
    });
}

// Initialize ingredients on page load
updateIngredients();

// Update ingredients when input changes
scaleInput.addEventListener("input", updateIngredients);

// Checkbox effect
ingredientItems.forEach(input => {
    input.addEventListener("change", () => {
        const li = input.closest("li");
        if (input.checked) {
            li.style.textDecoration = "line-through";
            li.style.opacity = "0.6";
        } else {
            li.style.textDecoration = "none";
            li.style.opacity = "1";
        }
    });
});
</script>


</main>

</body>

</html>
