<!DOCTYPE html>
<html>
    <head>
        <title>Lemon Sorbet - Recipe Lab</title>
        <meta charset="utf-8" />
        <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://hersheyzinc.github.io/recipe-archive.github.io/theme/css/custom.css" rel="stylesheet" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    </head>

    <body id="index" class="archive">
        <div class="container">
            <div class="header">
                <h3 class="text-muted"><a href="https://hersheyzinc.github.io/recipe-archive.github.io/index.html">Recipe Lab</a></h3>
                <h2 class="text-muted"></h2>
            </div>

<div class="recipe-layout">

    <div class="recipe-main">
    
        <h1>Lemon Sorbet</h1>
    
        <p><p>Milky lemon sorbet that tastes like yakult</p></p>
    
        <p class="tag">creami</p>
    
        <h3>Yield</h3>
    
        <input id="scale" type="number"
            value="1"
            step="1"
            style="width:60px;">
    
        <span id="yield-display">
        pint(s)
        </span>






        
        <h2>Ingredients</h2>
    
        <ul id="ingredients" style="list-style: none">
            <li>
                <label>
                  <input type="checkbox" class="ingredient-checkbox" data-base="0.5"
                         data-name="sugar" data-unit="cups"
                         data-note="">
                  <span class="amount">0.5</span> cups sugar
                </label>
            </li>
            <li>
                <label>
                  <input type="checkbox" class="ingredient-checkbox" data-base="1"
                         data-name="corn syrup" data-unit="tbsp"
                         data-note="">
                  <span class="amount">1</span> tbsp corn syrup
                </label>
            </li>
            <li>
                <label>
                  <input type="checkbox" class="ingredient-checkbox" data-base="90"
                         data-name="greek style yoghurt" data-unit="g"
                         data-note="">
                  <span class="amount">90</span> g greek style yoghurt
                </label>
            </li>
            <li>
                <label>
                  <input type="checkbox" class="ingredient-checkbox" data-base="0.5"
                         data-name="lemon juice" data-unit="cups"
                         data-note="(~2 lemons)">
                  <span class="amount">0.5</span> cups lemon juice
 (~2 lemons)                </label>
            </li>
            <li>
                <label>
                  <input type="checkbox" class="ingredient-checkbox" data-base="1"
                         data-name="milk" data-unit="cups"
                         data-note="">
                  <span class="amount">1</span> cups milk
                </label>
            </li>
        </ul>
    
    </div>
    
    <div class="recipe-image-container">

        <img class="recipe-image" src="https://hersheyzinc.github.io/recipe-archive.github.io/recipes/lemon-sorbet/image.jpg" alt="Lemon Sorbet">
    </div>
    
</div>
    
<h2>Instructions</h2>
    
<ol>
<li>
<p>In a large bowl, whisk together all the ingredients until fully combined.</p>
</li>
<li>
<p>Pour base into creami pint and freeze for 24 hours.</p>
</li>
<li>
<p>Spin on <strong>Sorbet</strong> mode.</p>
</li>
</ol>

<script>
const scaleInput = document.getElementById("scale");

const panRadiusInput = document.getElementById("pan-radius");
const panLengthInput = document.getElementById("pan-length");
const panWidthInput = document.getElementById("pan-width");

const ingredientItems = document.querySelectorAll("#ingredients li input.ingredient-checkbox");
const ingredientList = document.getElementById("ingredients");
const shoppingListToggle = document.getElementById("shopping-list-mode");
const shoppingList = document.getElementById("shopping-ingredients");
const shoppingGroups = [];


// --- SAFE PARSER ---
function safeFloat(value, fallback = 0) {
    const n = parseFloat(value);
    return isNaN(n) ? fallback : n;
}


// --- INITIAL VALUES ---
const originalYield = safeFloat(scaleInput.value, 1);

const originalRadius = panRadiusInput ? safeFloat(panRadiusInput.value, 0) : 0;
const originalLength = panLengthInput ? safeFloat(panLengthInput.value, 0) : 0;
const originalWidth = panWidthInput ? safeFloat(panWidthInput.value, 0) : 0;


// --- STORE BASE INGREDIENTS ---
ingredientItems.forEach(input => {
    input.dataset.baseAmount = safeFloat(input.dataset.base, 0);
});


// Match only the same ingredient and unit; do not combine different flour types or units.
function normalizeIngredient(value) {
    return value.trim().replace(/\s+/g, " ").toLowerCase();
}

function updateCheckboxStyle(input) {
    const li = input.closest("li");
    li.style.textDecoration = input.checked ? "line-through" : "none";
    li.style.opacity = input.checked ? "0.6" : "1";
}

function updateShoppingCheckbox(group) {
    const checkedCount = group.sources.filter(input => input.checked).length;
    group.checkbox.checked = checkedCount === group.sources.length;
    group.checkbox.indeterminate = checkedCount > 0 && checkedCount < group.sources.length;
    updateCheckboxStyle(group.checkbox);
}

function buildShoppingList() {
    const groups = new Map();

    ingredientItems.forEach(input => {
        const name = input.dataset.name;
        const unit = input.dataset.unit;
        const key = JSON.stringify([normalizeIngredient(name), normalizeIngredient(unit)]);
        if (!groups.has(key)) {
            groups.set(key, { name, unit, sources: [], notes: new Map(), baseAmount: 0 });
        }
        const group = groups.get(key);
        group.sources.push(input);
        group.baseAmount += safeFloat(input.dataset.baseAmount, 0);
        const note = input.dataset.note.trim();
        if (note) group.notes.set(normalizeIngredient(note), note);
    });

    groups.forEach(group => {
        const li = document.createElement("li");
        const label = document.createElement("label");
        group.checkbox = document.createElement("input");
        group.checkbox.type = "checkbox";
        group.checkbox.className = "ingredient-checkbox";
        group.amountSpan = document.createElement("span");
        group.amountSpan.className = "amount";
        const description = [group.unit, group.name, ...group.notes.values()].filter(Boolean).join(" ");
        label.append(group.checkbox, group.amountSpan, document.createTextNode(" " + description));
        li.append(label);
        shoppingList.append(li);
        shoppingGroups.push(group);

        group.checkbox.addEventListener("change", () => {
            group.sources.forEach(input => {
                input.checked = group.checkbox.checked;
                updateCheckboxStyle(input);
            });
            updateShoppingCheckbox(group);
        });
        updateShoppingCheckbox(group);
    });
}


// --- ROUND PAN ---
function getRoundModifier() {
    if (!panRadiusInput || originalRadius === 0) return 1;

    const newRadius = safeFloat(panRadiusInput.value, originalRadius);

    return Math.pow(newRadius / originalRadius, 2);
}


// --- RECTANGULAR PAN ---
function getRectModifier() {
    if (!panLengthInput || !panWidthInput) return 1;
    if (originalLength === 0 || originalWidth === 0) return 1;

    const newL = safeFloat(panLengthInput.value, originalLength);
    const newW = safeFloat(panWidthInput.value, originalWidth);

    return (newL * newW) / (originalLength * originalWidth);
}


// --- MAIN ---
function updateIngredients() {

    const desiredYield = safeFloat(scaleInput.value, originalYield);

    const rect = getRectModifier();
    const round = getRoundModifier();

    const panModifier = rect !== 1 ? rect : round;

    ingredientItems.forEach(input => {

        const li = input.closest("li");
        const amountSpan = li.querySelector(".amount");

        const base = safeFloat(input.dataset.baseAmount, 0);

        const scaled = (base / originalYield) * desiredYield * panModifier;

        amountSpan.textContent = scaled.toFixed(2);
    });

    shoppingGroups.forEach(group => {
        const scaled = (group.baseAmount / originalYield) * desiredYield * panModifier;
        group.amountSpan.textContent = scaled.toFixed(2);
    });
}


// --- INIT ---
if (shoppingListToggle) {
    buildShoppingList();
    shoppingListToggle.addEventListener("change", () => {
        ingredientList.hidden = shoppingListToggle.checked;
        shoppingList.hidden = !shoppingListToggle.checked;
    });
}
updateIngredients();


// --- EVENTS ---
scaleInput.addEventListener("input", updateIngredients);

if (panRadiusInput) {
    panRadiusInput.addEventListener("input", updateIngredients);
}

if (panLengthInput) {
    panLengthInput.addEventListener("input", updateIngredients);
}

if (panWidthInput) {
    panWidthInput.addEventListener("input", updateIngredients);
}

// Checkbox effect
ingredientItems.forEach(input => {
    input.addEventListener("change", () => {
        updateCheckboxStyle(input);
        shoppingGroups.forEach(updateShoppingCheckbox);
    });
});
</script>

            <footer id="contentinfo" class="footer">

            </footer><!-- /#contentinfo -->
        </div><!-- container -->
    </body>
</html>
